name: fomo-fetch
on:
  schedule:
    - cron: '7-52/15 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: fomo-fetch
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install curl_cffi
      - name: Fetch cycle
        env:
          FOMO_PIPELINE_KEY: ${{ secrets.FOMO_PIPELINE_KEY }}
        run: python runner.py
